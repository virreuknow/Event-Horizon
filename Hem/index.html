<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Horizon - Rymdnyheter</title>
  <link href="style.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

<header>🚀 Event Horizon</header>

<div class="breaking-news" id="breaking-news">
  Laddar senaste nytt...
</div>
<div class="search-news">
    <form onsubmit="searchNews(); event.preventDefault()">
        <input placeholder="Sök..." id="input" style="font-family: 'Courier New', Courier, monospace;">
        <button type="submit" style="background-color: white; border: none;font-family: 'Courier New', Courier, monospace;">Skicka</button>
    </form>
</div>

<div class="container">
  <h2>Senaste Artiklar</h2>
  <div class="news-grid" id="article-container"></div>
  <form onclick="moreFunc(); event.preventDefault()">
    <button class="buttonArticle" id="buttonArticle">🔻</button>
  </form>

  <h2>Senaste Bloggar</h2>
  <div class="news-grid" id="blogs-container"></div>
</div>

<footer>
  2025 Event Horizon | Byggd med SpaceFlight News API 🚀
</footer>

<script src="script.js"></script>

</body>
</html>

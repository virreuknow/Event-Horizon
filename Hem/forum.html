<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Åva Öppet Hus</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .topic { padding: 10px; margin-bottom: 10px; border: 1px solid #aaa; border-radius: 5px; cursor: pointer; }
        .message { margin-left: 20px; padding: 5px; border-left: 2px solid #888; }
        input, textarea { display: block; margin-bottom: 10px; width: 300px; }
        button { padding: 5px 12px; cursor: pointer; }
    </style>
</head>
<body>

<h1>
    Åva Öppet Hus
    
</h1>

<h2>Skapa topic</h2>
<form id="postForm">
    <input type="text" id="username" placeholder="Ditt namn" required>
    <input type="text" id="topic" placeholder="Topic" required>
    <textarea id="message" placeholder="Meddelande" required></textarea>
    <button type="submit">Skapa</button>
</form>

<hr>
<h2>Alla topics</h2>
<div id="topics"></div>

<script>
const API = "/api";

// =====================================================
// HÄMTA ALLA TOPICS
// =====================================================
function loadTopics() {
    fetch(`${API}/topics`)
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById("topics");
            container.innerHTML = "";

            data.forEach(t => {
                const div = document.createElement("div");
                div.className = "topic";
                div.innerHTML = `
                    <b>${t.username}</b>: ${t.topics}
                    <button style="float:right" onclick="event.stopPropagation(); deleteMessage(${t.id}, true)">Ta bort</button>
                `;
                div.onclick = () => openTopic(t.id);
                container.appendChild(div);
            });
        })
        .catch(err => console.error("Fel vid hämtning:", err));
}

// =====================================================
// ÖPPNA TOPIC + KOMMENTARER
// =====================================================
function openTopic(id) {
    fetch(`${API}/topic/${id}`)
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById("topics");
            const { topic, messages } = data;

            container.innerHTML = `<h2>${topic.topics}</h2>
                <p><b>${topic.username}</b>: ${topic.messages}</p>
                <button onclick="deleteMessage(${topic.id}, true)">Ta bort topic</button>
                <hr>`;

            messages.forEach(m => {
                const div = document.createElement("div");
                div.className = "message";
                div.innerHTML = `
                    ${m.username}: ${m.messages}
                    <button style="margin-left:10px" onclick="deleteMessage(${m.id}, false, ${topic.id})">Ta bort</button>
                `;
                container.appendChild(div);
            });

            container.innerHTML += `
                <h3>Svara</h3>
                <input id="replyUser" placeholder="Namn">
                <textarea id="replyMsg" placeholder="Meddelande"></textarea>
                <button onclick="reply(${id})">Skicka</button>
                <br><br>
                <button onclick="loadTopics()">⬅ Tillbaka</button>
            `;
        })
        .catch(err => console.error("Kunde inte öppna topic:", err));
}

// =====================================================
// SKICKA SVAR
// =====================================================
function reply(parentId) {
    const username = document.getElementById("replyUser").value;
    const message = document.getElementById("replyMsg").value;

    fetch(`${API}/reply`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            username,
            message,
            topicId: parentId
        })
    }).then(() => openTopic(parentId));
}

// =====================================================
// SKAPA NYTT TOPIC
// =====================================================
document.getElementById("postForm").addEventListener("submit", e => {
    e.preventDefault();

    const username = document.getElementById("username").value;
    const topic = document.getElementById("topic").value;
    const message = document.getElementById("message").value;

    fetch(`${API}/create`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            username,
            topic,
            message
        })
    }).then(() => loadTopics());
});

// =====================================================
// TA BORT MEDDELANDE/TOPIC
// =====================================================
function deleteMessage(id, isTopic, parentId) {
    if (!confirm("Ta bort?")) return;
    fetch(`${API}/message/${id}`, { method: "DELETE" })
        .then(() => {
            if (isTopic) {
                loadTopics();
            } else {
                openTopic(parentId);
            }
        })
        .catch(err => console.error("Kunde inte ta bort:", err));
}

// Starta
loadTopics();
</script>

</body>
</html>
